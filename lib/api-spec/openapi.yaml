openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Wheel Strategy Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: settings
    description: Screener settings
  - name: scan
    description: Wheel candidates scan
  - name: chain
    description: Option chain explorer
  - name: market
    description: Market summary
  - name: positions
    description: Sold-put position tracker
  - name: notifications
    description: Position alerts (assignment risk, near-expiry)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current screener settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update screener settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /scan:
    post:
      operationId: runScan
      tags: [scan]
      summary: Run the wheel screener using current settings
      description: |
        Scans the watchlist and returns ranked short-put candidates.
        Results are cached to disk according to settings.cacheTtlMinutes
        so repeated calls within the TTL are instant.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "200":
          description: Ranked candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

  /scan/latest:
    get:
      operationId: getLatestScan
      tags: [scan]
      summary: Get the most recent scan results without re-running
      responses:
        "200":
          description: Latest scan (may be empty if never scanned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

  /scan/summary:
    get:
      operationId: getScanSummary
      tags: [scan]
      summary: Aggregated stats over the latest scan
      description: |
        Lightweight aggregate view of the latest candidate set —
        average annualized yield, count of candidates with earnings in
        the DTE window, top sector / ticker, IV-rank distribution buckets.
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSummary"

  /quote/{ticker}:
    get:
      operationId: getQuote
      tags: [market]
      summary: Get spot price and earnings flag for a ticker
      parameters:
        - in: path
          name: ticker
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /chain/{ticker}:
    get:
      operationId: getChainExpirations
      tags: [chain]
      summary: List expirations for a ticker
      parameters:
        - in: path
          name: ticker
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Expirations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainExpirations"

  /chain/{ticker}/{expiry}:
    get:
      operationId: getChain
      tags: [chain]
      summary: Get put + call chain with greeks for a ticker and expiry
      parameters:
        - in: path
          name: ticker
          required: true
          schema: { type: string }
        - in: path
          name: expiry
          required: true
          description: ISO date (YYYY-MM-DD)
          schema: { type: string }
      responses:
        "200":
          description: Chain with greeks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chain"

  /positions:
    get:
      operationId: listPositions
      tags: [positions]
      summary: List tracked sold-put positions with live P/L
      responses:
        "200":
          description: Positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionsList"
    post:
      operationId: createPosition
      tags: [positions]
      summary: Log a newly-opened sold put
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionInput"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"

  /positions/stats:
    get:
      operationId: getPositionsStats
      tags: [positions]
      summary: Aggregate performance stats across closed positions
      description: |
        Performance journal — cumulative realized P/L over time, premium
        collected per month, and headline summary stats (win rate, average
        days held, best/worst trade). Computed from closed positions only.
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionsStats"

  /positions/{id}:
    patch:
      operationId: updatePosition
      tags: [positions]
      summary: Close (or re-open) a tracked position
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
    delete:
      operationId: deletePosition
      tags: [positions]
      summary: Remove a tracked position
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List recent position alerts (assignment risk / near-expiry)
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsList"

  /notifications/{id}/ack:
    post:
      operationId: ackNotification
      tags: [notifications]
      summary: Mark a notification as acknowledged
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/ack-all:
    post:
      operationId: ackAllNotifications
      tags: [notifications]
      summary: Mark all unread notifications as acknowledged
      responses:
        "200":
          description: Count of acknowledged notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckAllResult"

  /notifications/scan:
    post:
      operationId: scanForAlerts
      tags: [notifications]
      summary: Force an immediate alert scan over open positions
      responses:
        "200":
          description: Scan stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertScanResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Settings:
      type: object
      required:
        - tickers
        - minDte
        - maxDte
        - targetDelta
        - minDelta
        - maxDelta
        - minOpenInterest
        - minBid
        - minUnderlyingPrice
        - riskFreeRate
        - topN
        - cacheTtlMinutes
      properties:
        tickers:
          type: array
          items: { type: string }
        minDte: { type: integer, minimum: 1 }
        maxDte: { type: integer, minimum: 1 }
        targetDelta: { type: number, minimum: 0, maximum: 1 }
        minDelta: { type: number, minimum: 0, maximum: 1 }
        maxDelta: { type: number, minimum: 0, maximum: 1 }
        minOpenInterest: { type: integer, minimum: 0 }
        minBid: { type: number, minimum: 0 }
        minUnderlyingPrice: { type: number, minimum: 0 }
        riskFreeRate: { type: number, minimum: 0, maximum: 1 }
        topN: { type: integer, minimum: 1, maximum: 200 }
        cacheTtlMinutes: { type: integer, minimum: 1, maximum: 1440 }

    SettingsInput:
      type: object
      required:
        - tickers
        - minDte
        - maxDte
        - targetDelta
        - minDelta
        - maxDelta
        - minOpenInterest
        - minBid
        - minUnderlyingPrice
        - riskFreeRate
        - topN
        - cacheTtlMinutes
      properties:
        tickers:
          type: array
          items: { type: string }
        minDte: { type: integer, minimum: 1 }
        maxDte: { type: integer, minimum: 1 }
        targetDelta: { type: number, minimum: 0, maximum: 1 }
        minDelta: { type: number, minimum: 0, maximum: 1 }
        maxDelta: { type: number, minimum: 0, maximum: 1 }
        minOpenInterest: { type: integer, minimum: 0 }
        minBid: { type: number, minimum: 0 }
        minUnderlyingPrice: { type: number, minimum: 0 }
        riskFreeRate: { type: number, minimum: 0, maximum: 1 }
        topN: { type: integer, minimum: 1, maximum: 200 }
        cacheTtlMinutes: { type: integer, minimum: 1, maximum: 1440 }

    ScanInput:
      type: object
      description: Optional one-shot overrides for this scan (does not persist)
      properties:
        tickers:
          type: array
          items: { type: string }
        minDte: { type: integer, minimum: 1 }
        maxDte: { type: integer, minimum: 1 }
        targetDelta: { type: number, minimum: 0, maximum: 1 }
        minDelta: { type: number, minimum: 0, maximum: 1 }
        maxDelta: { type: number, minimum: 0, maximum: 1 }
        minOpenInterest: { type: integer, minimum: 0 }
        minBid: { type: number, minimum: 0 }
        minUnderlyingPrice: { type: number, minimum: 0 }
        riskFreeRate: { type: number, minimum: 0, maximum: 1 }
        topN: { type: integer, minimum: 1, maximum: 200 }
        forceRefresh: { type: boolean }

    Candidate:
      type: object
      required:
        - ticker
        - spot
        - expiry
        - dte
        - strike
        - delta
        - bid
        - iv
        - openInterest
        - premiumPerContract
        - collateralPerContract
        - staticReturnPct
        - annualizedPct
        - breakeven
        - pctOtm
        - earningsInWindow
      properties:
        ticker: { type: string }
        spot: { type: number }
        expiry: { type: string, description: "ISO date YYYY-MM-DD" }
        dte: { type: integer }
        strike: { type: number }
        delta: { type: number }
        bid: { type: number }
        ask: { type: ["number", "null"] }
        iv: { type: number, description: "Implied volatility, 0..1" }
        openInterest: { type: integer }
        volume: { type: ["integer", "null"] }
        premiumPerContract: { type: number }
        collateralPerContract: { type: number }
        staticReturnPct: { type: number }
        annualizedPct: { type: number }
        breakeven: { type: number }
        pctOtm: { type: number }
        ivRank: { type: ["number", "null"], description: "0..1, proxy from realized vol" }
        hv30: { type: ["number", "null"] }
        earningsDate: { type: ["string", "null"] }
        earningsInWindow: { type: boolean }

    ScanError:
      type: object
      required: [ticker, reason]
      properties:
        ticker: { type: string }
        reason: { type: string }

    ScanResult:
      type: object
      required:
        - scannedAt
        - candidates
        - errors
        - tickersScanned
        - tickersWithCandidate
        - cached
        - stale
      properties:
        scannedAt: { type: ["string", "null"], description: "ISO timestamp of when this scan ran" }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ScanError"
        tickersScanned: { type: integer }
        tickersWithCandidate: { type: integer }
        cached: { type: boolean }
        stale: { type: boolean, description: "True when the persisted snapshot is older than cacheTtlMinutes; the dashboard should treat candidates as historical and prompt a re-scan." }

    IvRankBucket:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }

    ScanSummary:
      type: object
      required:
        - scannedAt
        - candidateCount
        - earningsFlaggedCount
        - avgAnnualizedPct
        - medianAnnualizedPct
        - maxAnnualizedPct
        - totalCollateral
        - totalPremium
        - ivRankBuckets
        - topTickers
      properties:
        scannedAt: { type: ["string", "null"] }
        candidateCount: { type: integer }
        earningsFlaggedCount: { type: integer }
        avgAnnualizedPct: { type: number }
        medianAnnualizedPct: { type: number }
        maxAnnualizedPct: { type: number }
        totalCollateral: { type: number }
        totalPremium: { type: number }
        ivRankBuckets:
          type: array
          items:
            $ref: "#/components/schemas/IvRankBucket"
        topTickers:
          type: array
          description: Top 5 candidates by annualized yield
          items:
            $ref: "#/components/schemas/Candidate"

    Quote:
      type: object
      required: [ticker, spot, asOf, earningsInWindow, marketOpen]
      properties:
        ticker: { type: string }
        spot: { type: number }
        asOf: { type: string }
        earningsDate: { type: ["string", "null"] }
        earningsInWindow: { type: boolean }
        name: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        dayChange: { type: ["number", "null"] }
        dayChangePct: { type: ["number", "null"] }
        marketOpen:
          type: boolean
          description: True when US equity regular trading hours are currently open.

    ChainExpirations:
      type: object
      required: [ticker, spot, expirations]
      properties:
        ticker: { type: string }
        spot: { type: number }
        expirations:
          type: array
          items: { type: string, description: "ISO date YYYY-MM-DD" }

    ChainRow:
      type: object
      required:
        - strike
        - bid
        - ask
        - lastPrice
        - iv
        - delta
        - gamma
        - theta
        - vega
        - openInterest
        - volume
        - inTheMoney
      properties:
        strike: { type: number }
        bid: { type: number }
        ask: { type: number }
        lastPrice: { type: number }
        iv: { type: number }
        delta: { type: number }
        gamma: { type: number }
        theta: { type: number }
        vega: { type: number }
        openInterest: { type: integer }
        volume: { type: integer }
        inTheMoney: { type: boolean }

    Chain:
      type: object
      required: [ticker, spot, expiry, dte, puts, calls, fetchedAt, marketOpen, staleBid, staleIv]
      properties:
        ticker: { type: string }
        spot: { type: number }
        expiry: { type: string }
        dte: { type: integer }
        puts:
          type: array
          items:
            $ref: "#/components/schemas/ChainRow"
        calls:
          type: array
          items:
            $ref: "#/components/schemas/ChainRow"
        fetchedAt:
          type: string
          description: ISO timestamp when this chain was last fetched from the upstream provider.
        marketOpen:
          type: boolean
          description: True when US equity regular trading hours are currently open.
        staleBid:
          type: boolean
          description: True when bids are likely stale (after-hours or majority of rows show zero bid).
        staleIv:
          type: boolean
          description: True when implied vols look stale or quantized (after-hours or majority of rows show implausibly low IV).

    PositionInput:
      type: object
      required: [ticker, strike, expiry, premium, contracts]
      properties:
        ticker: { type: string, minLength: 1 }
        strike: { type: number, exclusiveMinimum: 0 }
        expiry: { type: string, description: "ISO date YYYY-MM-DD" }
        premium: { type: number, minimum: 0, description: "Premium received per share" }
        contracts: { type: integer, minimum: 1 }
        notes: { type: ["string", "null"] }

    PositionUpdate:
      type: object
      properties:
        closePrice: { type: ["number", "null"], minimum: 0, description: "Per-share buy-to-close price; null to re-open" }
        notes: { type: ["string", "null"] }

    Position:
      type: object
      required:
        - id
        - ticker
        - strike
        - expiry
        - premium
        - contracts
        - openedAt
        - status
        - dte
      properties:
        id: { type: integer }
        ticker: { type: string }
        strike: { type: number }
        expiry: { type: string }
        premium: { type: number }
        contracts: { type: integer }
        openedAt: { type: string }
        closedAt: { type: ["string", "null"] }
        closePrice: { type: ["number", "null"] }
        notes: { type: ["string", "null"] }
        status:
          type: string
          enum: [open, closed]
        dte: { type: integer, description: "Days to expiration (negative when expired)" }
        spot: { type: ["number", "null"], description: "Current underlying price" }
        currentBid: { type: ["number", "null"], description: "Current put bid at this strike for this expiry" }
        unrealizedPnl: { type: ["number", "null"], description: "(premium - currentBid) * 100 * contracts; null when bid unavailable" }
        realizedPnl: { type: ["number", "null"], description: "(premium - closePrice) * 100 * contracts; null when open" }
        assignmentRisk: { type: boolean, description: "Open position where spot has fallen below strike" }
        expiringSoon: { type: boolean, description: "Open position with DTE <= 7" }

    PositionsList:
      type: object
      required: [positions, totals]
      properties:
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        totals:
          type: object
          required: [openCount, closedCount, totalPremium, totalCollateral, openUnrealizedPnl, closedRealizedPnl]
          properties:
            openCount: { type: integer }
            closedCount: { type: integer }
            totalPremium: { type: number, description: "Sum of premium*100*contracts for open positions" }
            totalCollateral: { type: number, description: "Sum of strike*100*contracts for open positions" }
            openUnrealizedPnl: { type: number }
            closedRealizedPnl: { type: number }

    PositionsStats:
      type: object
      required:
        - summary
        - cumulativePnl
        - premiumByMonth
      properties:
        summary:
          type: object
          required:
            - closedCount
            - winCount
            - lossCount
            - winRate
            - totalRealizedPnl
            - totalPremiumCollected
            - avgPremiumPerTrade
            - avgDaysHeld
          properties:
            closedCount: { type: integer }
            winCount: { type: integer, description: "Closed trades with realized P/L >= 0" }
            lossCount: { type: integer }
            winRate: { type: number, description: "winCount / closedCount, 0 when no closed trades" }
            totalRealizedPnl: { type: number }
            totalPremiumCollected: { type: number, description: "Sum of premium*100*contracts across closed trades" }
            avgPremiumPerTrade: { type: number }
            avgDaysHeld: { type: number, description: "Calendar days between openedAt and closedAt" }
            bestTrade:
              type: ["object", "null"]
              required: [id, ticker, strike, expiry, contracts, realizedPnl, closedAt]
              properties:
                id: { type: integer }
                ticker: { type: string }
                strike: { type: number }
                expiry: { type: string }
                contracts: { type: integer }
                realizedPnl: { type: number }
                closedAt: { type: string }
            worstTrade:
              type: ["object", "null"]
              required: [id, ticker, strike, expiry, contracts, realizedPnl, closedAt]
              properties:
                id: { type: integer }
                ticker: { type: string }
                strike: { type: number }
                expiry: { type: string }
                contracts: { type: integer }
                realizedPnl: { type: number }
                closedAt: { type: string }
        cumulativePnl:
          type: array
          description: One point per closed trade (in close order); cumulative running total.
          items:
            type: object
            required: [date, pnl, cumulative]
            properties:
              date: { type: string, description: "ISO datetime of close" }
              pnl: { type: number, description: "Realized P/L for that trade" }
              cumulative: { type: number, description: "Running total of realized P/L" }
        premiumByMonth:
          type: array
          description: Premium collected (premium*100*contracts) grouped by close month.
          items:
            type: object
            required: [month, premium, count]
            properties:
              month: { type: string, description: "YYYY-MM" }
              premium: { type: number }
              count: { type: integer }

    DeleteResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    Notification:
      type: object
      required: [id, positionId, kind, ticker, message, triggeredAt]
      properties:
        id: { type: integer }
        positionId: { type: integer }
        kind:
          type: string
          enum: [itm, expiring_soon]
          description: itm = spot has fallen below strike; expiring_soon = DTE <= 3
        ticker: { type: string }
        message: { type: string }
        triggeredAt: { type: string }
        acknowledgedAt: { type: ["string", "null"] }

    NotificationsList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unreadCount: { type: integer }

    AckAllResult:
      type: object
      required: [acknowledged]
      properties:
        acknowledged: { type: integer }

    AlertScanResult:
      type: object
      required: [scanned, itmAlerts, expiringAlerts]
      properties:
        scanned: { type: integer }
        itmAlerts: { type: integer }
        expiringAlerts: { type: integer }
