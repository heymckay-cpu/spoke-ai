openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Wheel Strategy Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: settings
    description: Screener settings
  - name: scan
    description: Wheel candidates scan
  - name: chain
    description: Option chain explorer
  - name: market
    description: Market summary
  - name: positions
    description: Sold-put position tracker
  - name: notifications
    description: Position alerts (assignment risk, near-expiry)
  - name: tier
    description: Subscription tier and capability gating
  - name: qa
    description: Natural-language portfolio Q&A
  - name: sectors
    description: Provider-resolved ticker → sector lookup
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current screener settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update screener settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /scan:
    post:
      operationId: runScan
      tags: [scan]
      summary: Run the wheel screener using current settings
      description: |
        Scans the watchlist and returns ranked short-put candidates.
        Results are cached to disk according to settings.cacheTtlMinutes
        so repeated calls within the TTL are instant.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "200":
          description: Ranked candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

  /scan/latest:
    get:
      operationId: getLatestScan
      tags: [scan]
      summary: Get the most recent scan results without re-running
      responses:
        "200":
          description: Latest scan (may be empty if never scanned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

  /scan/summary:
    get:
      operationId: getScanSummary
      tags: [scan]
      summary: Aggregated stats over the latest scan
      description: |
        Lightweight aggregate view of the latest candidate set —
        average annualized yield, count of candidates with earnings in
        the DTE window, top sector / ticker, IV-rank distribution buckets.
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSummary"

  /scan/explain:
    post:
      operationId: explainCandidate
      tags: [scan]
      summary: Plain-English AI rationale for a single screener candidate
      description: |
        Generates (or returns the cached) AI explanation for one candidate
        identified by ticker + strike + expiry against the current scan
        snapshot. Falls back to a deterministic non-LLM summary when the
        caller's tier lacks the AI explainer capability or the upstream
        Anthropic call errors / rate-limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainCandidateInput"
      responses:
        "200":
          description: Explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateExplanation"
        "404":
          description: No matching candidate in the latest scan snapshot
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /scan/calls:
    post:
      operationId: runCallScan
      tags: [scan]
      summary: Scan covered-call candidates against current holdings
      description: |
        Mirrors the short-put screener but for covered calls. Scans every
        holding with >= 100 shares, filtering to OTM strikes above
        max(spot, avgCost) so a covered call can never lock in a loss on
        the underlying. Targets the same delta / DTE window configured
        in /settings.
      responses:
        "200":
          description: Ranked covered-call candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallScanResult"

  /iv/history/{ticker}:
    get:
      operationId: getIvHistory
      tags: [scan]
      summary: 52-week ATM-IV snapshot history for a ticker
      description: |
        Returns the daily ATM 30-day IV snapshots stored for the ticker
        over the trailing 52 weeks. Used by the candidate drawer's
        sparkline. The series is empty when no snapshots have been
        captured yet for the ticker.
      parameters:
        - in: path
          name: ticker
          required: true
          schema: { type: string }
      responses:
        "200":
          description: IV history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IvHistory"

  /quote/{ticker}:
    get:
      operationId: getQuote
      tags: [market]
      summary: Get spot price and earnings flag for a ticker
      parameters:
        - in: path
          name: ticker
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /chain/{ticker}:
    get:
      operationId: getChainExpirations
      tags: [chain]
      summary: List expirations for a ticker
      parameters:
        - in: path
          name: ticker
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Expirations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainExpirations"

  /chain/{ticker}/{expiry}:
    get:
      operationId: getChain
      tags: [chain]
      summary: Get put + call chain with greeks for a ticker and expiry
      parameters:
        - in: path
          name: ticker
          required: true
          schema: { type: string }
        - in: path
          name: expiry
          required: true
          description: ISO date (YYYY-MM-DD)
          schema: { type: string }
      responses:
        "200":
          description: Chain with greeks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chain"

  /positions:
    get:
      operationId: listPositions
      tags: [positions]
      summary: List tracked sold-put positions with live P/L
      responses:
        "200":
          description: Positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionsList"
    post:
      operationId: createPosition
      tags: [positions]
      summary: Log a newly-opened sold put
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionInput"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"

  /positions/stats:
    get:
      operationId: getPositionsStats
      tags: [positions]
      summary: Aggregate performance stats across closed positions
      description: |
        Performance journal — cumulative realized P/L over time, premium
        collected per month, and headline summary stats (win rate, average
        days held, best/worst trade). Computed from closed positions only.
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionsStats"

  /positions/{id}:
    patch:
      operationId: updatePosition
      tags: [positions]
      summary: Close (or re-open) a tracked position
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
    delete:
      operationId: deletePosition
      tags: [positions]
      summary: Remove a tracked position
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /holdings:
    get:
      operationId: listHoldings
      tags: [holdings]
      summary: List long-stock holdings with live market value
      responses:
        "200":
          description: Holdings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingsList"
    post:
      operationId: createHolding
      tags: [holdings]
      summary: Log a new stock holding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingInput"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"

  /holdings/{id}:
    patch:
      operationId: updateHolding
      tags: [holdings]
      summary: Update a stock holding (shares, average cost, notes)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
    delete:
      operationId: deleteHolding
      tags: [holdings]
      summary: Remove a stock holding
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /positions/{id}/roll:
    post:
      operationId: rollPosition
      tags: [positions]
      summary: Atomically close an open position and open a new (rolled) one
      description: |
        Closes the existing position at the supplied buy-to-close price and
        opens a brand-new short put with the supplied strike, expiry, premium
        and contract count. Both writes happen inside a single database
        transaction so the user can never end up with one leg without the
        other.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollPositionInput"
      responses:
        "200":
          description: Roll succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollPositionResult"

  /positions/roll/undo:
    post:
      operationId: undoRoll
      tags: [positions]
      summary: Undo a roll — delete the freshly-opened leg and re-open the closed one
      description: |
        Reverses a roll that was just performed. In a single database
        transaction this deletes the freshly-opened replacement leg and
        re-opens the previously-closed leg (clearing its closedAt and
        closePrice so it returns to the open positions list at its
        original premium). The opened leg must still be linked to the
        closed leg via rolledFromId or the request is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoRollInput"
      responses:
        "200":
          description: Roll reversed; the previously-closed leg is now open again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoRollResult"
        "404":
          description: Either leg no longer exists.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        "409":
          description: Legs are no longer in the expected post-roll shape (link broken, opened leg already rolled again, etc).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /positions/{id}/roll-suggestion:
    get:
      operationId: getRollSuggestion
      tags: [positions]
      summary: Smart roll target — next monthly expiry + live premium for same/-5% strikes
      description: |
        Suggests a roll target for an open position: the next standard
        monthly expiry (third Friday) on or after the current expiry +21
        days, plus live bid/mid premium for both the same strike and a
        ~5% lower strike, snapped to the nearest available strike on the
        suggested expiry's option chain.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Roll suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollSuggestion"
        "404":
          description: Position not found, no upcoming monthly expiry, or no chain available
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /positions/{id}/roll-quote/{expiry}/{strike}:
    get:
      operationId: getRollQuote
      tags: [positions]
      summary: Live premium quote for an arbitrary strike+expiry roll target
      description: |
        Looks up the live bid / ask / mid / lastPrice for the put at the
        given expiry+strike on the position's underlying. Used by the roll
        dialog to keep the "live quote" panel in sync as the user edits
        the new-leg strike or expiry.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: expiry
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: Target expiry date (YYYY-MM-DD)
        - in: path
          name: strike
          required: true
          schema:
            type: number
            exclusiveMinimum: 0
          description: Target strike price
      responses:
        "200":
          description: Live quote for the requested strike+expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollQuote"
        "404":
          description: Position not found, expiry/strike not listed, or chain unavailable
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /positions/{id}/advisor:
    get:
      operationId: getPositionAdvisor
      tags: [positions]
      summary: Roll vs. assignment vs. close recommendation for an open position
      description: |
        Builds the full decision context for a position (chain history, cost
        basis, latest quote, top roll candidates and concentration) and asks
        an LLM advisor for one of three verdicts: roll, assign or close.
        Recommendations are cached per (positionId, latest quote timestamp)
        so refreshes are cheap. When the LLM is unavailable, the response
        still returns the raw decision numbers with `available: false` so
        the UI can render a graceful fallback panel.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Advisor recommendation (or fallback when AI is unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionAdvisor"
        "404":
          description: Position not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List recent position alerts (assignment risk / near-expiry)
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsList"

  /notifications/{id}/ack:
    post:
      operationId: ackNotification
      tags: [notifications]
      summary: Mark a notification as acknowledged
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/ack-all:
    post:
      operationId: ackAllNotifications
      tags: [notifications]
      summary: Mark all unread notifications as acknowledged
      responses:
        "200":
          description: Count of acknowledged notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckAllResult"

  /notifications/scan:
    post:
      operationId: scanForAlerts
      tags: [notifications]
      summary: Force an immediate alert scan over open positions
      description: |
        Gated capability `alerts.email`. Returns 403 with a TierBlocked
        payload when the current user's tier is below the requirement.
      responses:
        "200":
          description: Scan stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertScanResult"
        "403":
          description: Tier required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierBlocked"

  /tier:
    get:
      operationId: getTier
      tags: [tier]
      summary: Get the current user's subscription tier and capability map
      responses:
        "200":
          description: Current tier and capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierStatus"
    put:
      operationId: setTier
      tags: [tier]
      summary: (Dev only) Update the current user's tier — for local testing
      description: |
        Intended for the dev-only switcher in Settings. In production this is
        replaced by a real billing flow; the route is left in place so the
        same UI can be reused once Stripe lands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TierUpdate"
      responses:
        "200":
          description: Updated tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierStatus"

  /qa/conversations:
    get:
      operationId: listQaConversations
      tags: [qa]
      summary: List recent Q&A conversations (paginated, newest first)
      description: |
        Returns conversations ordered by most-recent activity (last message
        time, falling back to created time). Each item includes a short
        preview of the latest message so the rail can render without a
        per-conversation fetch.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaConversationList"
    post:
      operationId: createQaConversation
      tags: [qa]
      summary: Create a new Q&A conversation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QaConversationInput"
      responses:
        "200":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaConversation"

  /qa/conversations/{id}:
    get:
      operationId: getQaConversation
      tags: [qa]
      summary: Load a conversation with its full message history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
    patch:
      operationId: renameQaConversation
      tags: [qa]
      summary: Rename a Q&A conversation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QaConversationUpdate"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaConversation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
    delete:
      operationId: deleteQaConversation
      tags: [qa]
      summary: Delete a Q&A conversation (and all its messages)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /qa/messages:
    post:
      operationId: sendQaMessage
      tags: [qa]
      summary: Send a user message and get the assistant's reply
      description: |
        Runs the read-only tool-use agent loop with Claude over the user's
        live portfolio data. Persists both the user message and the
        assistant's reply (with any structured attachments) to the
        conversation. Returns 503 with `code` describing the failure when
        the AI provider is unavailable (auth, rate limit, etc).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QaSendMessageInput"
      responses:
        "200":
          description: Assistant reply persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaSendMessageResult"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        "503":
          description: AI provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaUnavailable"

  /sectors:
    get:
      operationId: getSectors
      tags: [sectors]
      summary: Resolve sectors for a comma-separated list of tickers
      description: |
        Returns the GICS-flavored sector for each requested ticker, looked up
        via the active market data provider with an in-memory + DB cache.
        Tickers the provider can't classify fall back to a curated static
        table; tickers neither knows are returned as "Unclassified".
      parameters:
        - in: query
          name: tickers
          required: true
          description: Comma-separated list of tickers (case-insensitive).
          schema: { type: string }
      responses:
        "200":
          description: Sector map keyed by uppercased ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorMap"

  /qa/messages/stream:
    post:
      operationId: sendQaMessageStream
      tags: [qa]
      summary: Send a user message and stream the assistant reply as SSE
      description: |
        Streaming variant of `sendQaMessage`. Returns `text/event-stream`
        with one JSON payload per `data:` frame. The frame `type` field
        determines the shape:
          * `user_message` — once at start, contains the persisted user `QaMessage`.
          * `tool_start` — `{ name, label }` when the agent begins a read-only tool call.
          * `tool_end` — `{ name }` when that tool call completes.
          * `text` — `{ delta }` incremental assistant text (with attachment fences hidden).
          * `done` — once at end, contains the persisted assistant `QaMessage`.
          * `error` — `{ code, error }` if the AI provider failed mid-stream.
        Persistence semantics match `sendQaMessage`: the user row is always
        written; the assistant row is written only on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QaSendMessageInput"
      responses:
        "200":
          description: Server-sent event stream of agent progress and final reply.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        provider:
          type: string
          description: Active market data provider name (e.g. "yahoo", "polygon").
        live:
          type: boolean
          description: True when the active provider serves live (real-time) quotes; false for delayed feeds.
      required:
        - status
        - provider
        - live

    ConcentrationSettings:
      type: object
      description: |
        Per-ticker and per-sector cash-at-risk thresholds, expressed as a
        fraction (0..1) of total open cash-at-risk. Used to flag trades
        that would over-concentrate the portfolio.
      required:
        - tickerPct
        - sectorPct
      properties:
        tickerPct: { type: number, minimum: 0, maximum: 1 }
        sectorPct: { type: number, minimum: 0, maximum: 1 }

    Settings:
      type: object
      required:
        - tickers
        - minDte
        - maxDte
        - targetDelta
        - minDelta
        - maxDelta
        - minOpenInterest
        - minBid
        - minUnderlyingPrice
        - riskFreeRate
        - topN
        - cacheTtlMinutes
        - concentration
        - earningsInWindow
      properties:
        tickers:
          type: array
          items: { type: string }
        minDte: { type: integer, minimum: 1 }
        maxDte: { type: integer, minimum: 1 }
        targetDelta: { type: number, minimum: 0, maximum: 1 }
        minDelta: { type: number, minimum: 0, maximum: 1 }
        maxDelta: { type: number, minimum: 0, maximum: 1 }
        minOpenInterest: { type: integer, minimum: 0 }
        minBid: { type: number, minimum: 0 }
        minUnderlyingPrice: { type: number, minimum: 0 }
        riskFreeRate: { type: number, minimum: 0, maximum: 1 }
        topN: { type: integer, minimum: 1, maximum: 200 }
        cacheTtlMinutes: { type: integer, minimum: 1, maximum: 1440 }
        concentration: { $ref: "#/components/schemas/ConcentrationSettings" }
        earningsInWindow:
          type: string
          enum: [hide, only, include]
          description: How to treat candidates whose earnings date falls inside the DTE window. `hide` excludes them, `only` keeps just those, `include` keeps all.

    SettingsInput:
      type: object
      required:
        - tickers
        - minDte
        - maxDte
        - targetDelta
        - minDelta
        - maxDelta
        - minOpenInterest
        - minBid
        - minUnderlyingPrice
        - riskFreeRate
        - topN
        - cacheTtlMinutes
        - concentration
        - earningsInWindow
      properties:
        tickers:
          type: array
          items: { type: string }
        minDte: { type: integer, minimum: 1 }
        maxDte: { type: integer, minimum: 1 }
        targetDelta: { type: number, minimum: 0, maximum: 1 }
        minDelta: { type: number, minimum: 0, maximum: 1 }
        maxDelta: { type: number, minimum: 0, maximum: 1 }
        minOpenInterest: { type: integer, minimum: 0 }
        minBid: { type: number, minimum: 0 }
        minUnderlyingPrice: { type: number, minimum: 0 }
        riskFreeRate: { type: number, minimum: 0, maximum: 1 }
        topN: { type: integer, minimum: 1, maximum: 200 }
        cacheTtlMinutes: { type: integer, minimum: 1, maximum: 1440 }
        concentration: { $ref: "#/components/schemas/ConcentrationSettings" }
        earningsInWindow:
          type: string
          enum: [hide, only, include]

    ScanInput:
      type: object
      description: Optional one-shot overrides for this scan (does not persist)
      properties:
        tickers:
          type: array
          items: { type: string }
        minDte: { type: integer, minimum: 1 }
        maxDte: { type: integer, minimum: 1 }
        targetDelta: { type: number, minimum: 0, maximum: 1 }
        minDelta: { type: number, minimum: 0, maximum: 1 }
        maxDelta: { type: number, minimum: 0, maximum: 1 }
        minOpenInterest: { type: integer, minimum: 0 }
        minBid: { type: number, minimum: 0 }
        minUnderlyingPrice: { type: number, minimum: 0 }
        riskFreeRate: { type: number, minimum: 0, maximum: 1 }
        topN: { type: integer, minimum: 1, maximum: 200 }
        forceRefresh: { type: boolean }
        earningsInWindow:
          type: string
          enum: [hide, only, include]
          description: One-shot override for the earnings-in-window filter; falls back to the saved setting when omitted.

    Candidate:
      type: object
      required:
        - ticker
        - spot
        - expiry
        - dte
        - strike
        - delta
        - bid
        - iv
        - openInterest
        - premiumPerContract
        - collateralPerContract
        - staticReturnPct
        - annualizedPct
        - breakeven
        - pctOtm
        - earningsInWindow
        - ivRankBasis
        - ivPercentile
      properties:
        ticker: { type: string }
        spot: { type: number }
        expiry: { type: string, description: "ISO date YYYY-MM-DD" }
        dte: { type: integer }
        strike: { type: number }
        delta: { type: number }
        bid: { type: number }
        ask: { type: ["number", "null"] }
        iv: { type: number, description: "Implied volatility, 0..1" }
        openInterest: { type: integer }
        volume: { type: ["integer", "null"] }
        premiumPerContract: { type: number }
        collateralPerContract: { type: number }
        staticReturnPct: { type: number }
        annualizedPct: { type: number }
        breakeven: { type: number }
        pctOtm: { type: number }
        ivRank: { type: ["number", "null"], description: "0..1 IV rank — real percentile within the trailing 52-week ATM-IV history when enough snapshots exist, otherwise the realized-vol proxy." }
        ivPercentile: { type: ["number", "null"], description: "0..1 share of trailing 52-week days where IV was at or below the current IV. Null when basis is `provisional` or when history is too short." }
        ivRankBasis:
          type: string
          enum: [real, provisional]
          description: "`real` once 20+ daily IV snapshots have accumulated for the ticker; `provisional` while the proxy is still being used."
        hv30: { type: ["number", "null"] }
        earningsDate: { type: ["string", "null"] }
        earningsInWindow: { type: boolean }

    ScanError:
      type: object
      required: [ticker, reason]
      properties:
        ticker: { type: string }
        reason: { type: string }

    ScanResult:
      type: object
      required:
        - scannedAt
        - candidates
        - errors
        - tickersScanned
        - tickersWithCandidate
        - cached
        - stale
        - hiddenByEarningsCount
      properties:
        scannedAt: { type: ["string", "null"], description: "ISO timestamp of when this scan ran" }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ScanError"
        tickersScanned: { type: integer }
        tickersWithCandidate: { type: integer }
        cached: { type: boolean }
        stale: { type: boolean, description: "True when the persisted snapshot is older than cacheTtlMinutes; the dashboard should treat candidates as historical and prompt a re-scan." }
        hiddenByEarningsCount:
          type: integer
          description: "Number of qualifying candidates that were suppressed by the earnings-in-window filter (always 0 when the filter is `include` or `only`)."

    IvSnapshotPoint:
      type: object
      required: [date, iv]
      properties:
        date: { type: string, description: "ISO date YYYY-MM-DD" }
        iv: { type: number, description: "ATM 30-day implied volatility (decimal)" }

    IvHistory:
      type: object
      required: [ticker, basis, sampleSize, points]
      properties:
        ticker: { type: string }
        basis:
          type: string
          enum: [real, provisional]
          description: "`real` once 20+ daily snapshots have accumulated."
        sampleSize: { type: integer }
        points:
          type: array
          items:
            $ref: "#/components/schemas/IvSnapshotPoint"

    IvRankBucket:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }

    ScanSummary:
      type: object
      required:
        - scannedAt
        - candidateCount
        - earningsFlaggedCount
        - avgAnnualizedPct
        - medianAnnualizedPct
        - maxAnnualizedPct
        - totalCollateral
        - totalPremium
        - ivRankBuckets
        - topTickers
      properties:
        scannedAt: { type: ["string", "null"] }
        candidateCount: { type: integer }
        earningsFlaggedCount: { type: integer }
        avgAnnualizedPct: { type: number }
        medianAnnualizedPct: { type: number }
        maxAnnualizedPct: { type: number }
        totalCollateral: { type: number }
        totalPremium: { type: number }
        ivRankBuckets:
          type: array
          items:
            $ref: "#/components/schemas/IvRankBucket"
        topTickers:
          type: array
          description: Top 5 candidates by annualized yield
          items:
            $ref: "#/components/schemas/Candidate"

    Quote:
      type: object
      required: [ticker, spot, asOf, earningsInWindow, marketOpen]
      properties:
        ticker: { type: string }
        spot: { type: number }
        asOf: { type: string }
        earningsDate: { type: ["string", "null"] }
        earningsInWindow: { type: boolean }
        name: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        dayChange: { type: ["number", "null"] }
        dayChangePct: { type: ["number", "null"] }
        marketOpen:
          type: boolean
          description: True when US equity regular trading hours are currently open.

    ChainExpirations:
      type: object
      required: [ticker, spot, expirations]
      properties:
        ticker: { type: string }
        spot: { type: number }
        expirations:
          type: array
          items: { type: string, description: "ISO date YYYY-MM-DD" }

    ChainRow:
      type: object
      required:
        - strike
        - bid
        - ask
        - lastPrice
        - iv
        - delta
        - gamma
        - theta
        - vega
        - openInterest
        - volume
        - inTheMoney
      properties:
        strike: { type: number }
        bid: { type: number }
        ask: { type: number }
        lastPrice: { type: number }
        iv: { type: number }
        delta: { type: number }
        gamma: { type: number }
        theta: { type: number }
        vega: { type: number }
        openInterest: { type: integer }
        volume: { type: integer }
        inTheMoney: { type: boolean }

    Chain:
      type: object
      required: [ticker, spot, expiry, dte, puts, calls, fetchedAt, marketOpen, staleBid, staleIv]
      properties:
        ticker: { type: string }
        spot: { type: number }
        expiry: { type: string }
        dte: { type: integer }
        puts:
          type: array
          items:
            $ref: "#/components/schemas/ChainRow"
        calls:
          type: array
          items:
            $ref: "#/components/schemas/ChainRow"
        fetchedAt:
          type: string
          description: ISO timestamp when this chain was last fetched from the upstream provider.
        marketOpen:
          type: boolean
          description: True when US equity regular trading hours are currently open.
        staleBid:
          type: boolean
          description: True when bids are likely stale (after-hours or majority of rows show zero bid).
        staleIv:
          type: boolean
          description: True when implied vols look stale or quantized (after-hours or majority of rows show implausibly low IV).

    PositionInput:
      type: object
      required: [ticker, strike, expiry, premium, contracts]
      properties:
        ticker: { type: string, minLength: 1 }
        strike: { type: number, exclusiveMinimum: 0 }
        expiry: { type: string, description: "ISO date YYYY-MM-DD" }
        premium: { type: number, minimum: 0, description: "Premium received per share" }
        contracts: { type: integer, minimum: 1 }
        notes: { type: ["string", "null"] }
        rolledFromId:
          type: ["integer", "null"]
          description: "Optional id of the closed position this one was rolled from. The server will reject ids that don't exist."

    RollPositionInput:
      type: object
      required: [closePrice, strike, expiry, premium, contracts]
      description: Inputs to atomically close an existing position and open the rolled replacement.
      properties:
        closePrice: { type: number, minimum: 0, description: "Per-share buy-to-close price for the existing position" }
        strike: { type: number, exclusiveMinimum: 0, description: "Strike for the new (rolled) position" }
        expiry: { type: string, description: "ISO date YYYY-MM-DD for the new (rolled) position" }
        premium: { type: number, minimum: 0, description: "Premium per share received on the new (rolled) position" }
        contracts: { type: integer, minimum: 1, description: "Contract count for the new (rolled) position" }
        notes: { type: ["string", "null"], description: "Optional notes for the new (rolled) position" }

    RollPositionResult:
      type: object
      required: [closed, opened]
      properties:
        closed:
          $ref: "#/components/schemas/Position"
        opened:
          $ref: "#/components/schemas/Position"

    UndoRollInput:
      type: object
      required: [closedId, openedId]
      description: |
        References to the two legs produced by a recent roll: the leg that
        was closed and the freshly-opened replacement. The server validates
        the link between them before reversing the roll.
      properties:
        closedId:
          type: integer
          description: Id of the leg that was closed by the roll (will be re-opened).
        openedId:
          type: integer
          description: Id of the freshly-opened replacement leg (will be deleted).

    UndoRollResult:
      type: object
      required: [reopened, deletedId]
      properties:
        reopened:
          $ref: "#/components/schemas/Position"
        deletedId:
          type: integer
          description: Id of the leg that was deleted (the freshly-opened replacement).

    PositionUpdate:
      type: object
      properties:
        closePrice: { type: ["number", "null"], minimum: 0, description: "Per-share buy-to-close price; null to re-open" }
        notes: { type: ["string", "null"] }

    Position:
      type: object
      required:
        - id
        - ticker
        - strike
        - expiry
        - premium
        - contracts
        - openedAt
        - status
        - dte
      properties:
        id: { type: integer }
        ticker: { type: string }
        strike: { type: number }
        expiry: { type: string }
        premium: { type: number }
        contracts: { type: integer }
        openedAt: { type: string }
        closedAt: { type: ["string", "null"] }
        closePrice: { type: ["number", "null"] }
        notes: { type: ["string", "null"] }
        status:
          type: string
          enum: [open, closed]
        dte: { type: integer, description: "Days to expiration (negative when expired)" }
        spot: { type: ["number", "null"], description: "Current underlying price" }
        currentBid: { type: ["number", "null"], description: "Current put bid at this strike for this expiry" }
        unrealizedPnl: { type: ["number", "null"], description: "(premium - currentBid) * 100 * contracts; null when bid unavailable" }
        realizedPnl: { type: ["number", "null"], description: "(premium - closePrice) * 100 * contracts; null when open" }
        assignmentRisk: { type: boolean, description: "Open position where spot has fallen below strike" }
        expiringSoon: { type: boolean, description: "Open position with DTE <= 7" }
        rolledFromId:
          type: ["integer", "null"]
          description: "Id of the closed position this one was rolled from, if any."
        rolledFrom:
          type: ["object", "null"]
          description: "Summary of the position this one was rolled from (parent leg)."
          required: [id, ticker, strike, expiry]
          properties:
            id: { type: integer }
            ticker: { type: string }
            strike: { type: number }
            expiry: { type: string }
        rolledTo:
          type: ["object", "null"]
          description: "Summary of the position this one was rolled into (child leg)."
          required: [id, ticker, strike, expiry]
          properties:
            id: { type: integer }
            ticker: { type: string }
            strike: { type: number }
            expiry: { type: string }

    PositionsList:
      type: object
      required: [positions, totals]
      properties:
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        totals:
          type: object
          required: [openCount, closedCount, totalPremium, totalCollateral, openUnrealizedPnl, closedRealizedPnl]
          properties:
            openCount: { type: integer }
            closedCount: { type: integer }
            totalPremium: { type: number, description: "Sum of premium*100*contracts for open positions" }
            totalCollateral: { type: number, description: "Sum of strike*100*contracts for open positions" }
            openUnrealizedPnl: { type: number }
            closedRealizedPnl: { type: number }

    RollChainLeg:
      type: object
      required:
        - id
        - ticker
        - strike
        - expiry
        - premium
        - contracts
        - openedAt
        - status
        - premiumCollected
      properties:
        id: { type: integer }
        ticker: { type: string }
        strike: { type: number }
        expiry: { type: string }
        premium: { type: number }
        contracts: { type: integer }
        openedAt: { type: string }
        closedAt: { type: ["string", "null"] }
        closePrice: { type: ["number", "null"] }
        status:
          type: string
          enum: [open, closed]
        realizedPnl:
          type: ["number", "null"]
          description: "(premium - closePrice) * 100 * contracts; null when leg is still open"
        premiumCollected:
          type: number
          description: "premium * 100 * contracts"

    RollChain:
      type: object
      required:
        - rootId
        - ticker
        - legCount
        - closedLegCount
        - openedAt
        - latestStatus
        - latestExpiry
        - totalRealizedPnl
        - totalPremiumCollected
        - legs
      properties:
        rootId:
          type: integer
          description: Id of the original (un-rolled) leg that started the chain.
        ticker: { type: string }
        legCount: { type: integer, description: "Total legs in the chain (includes the original)." }
        closedLegCount: { type: integer }
        openedAt:
          type: string
          description: Open date of the original leg.
        latestStatus:
          type: string
          enum: [open, closed]
        latestExpiry:
          type: string
        totalRealizedPnl:
          type: number
          description: Sum of realized P/L across closed legs (open legs contribute zero).
        totalPremiumCollected:
          type: number
          description: Sum of premium*100*contracts across every leg.
        legs:
          type: array
          description: Legs in chronological order, oldest first.
          items:
            $ref: "#/components/schemas/RollChainLeg"

    PositionsStats:
      type: object
      required:
        - summary
        - cumulativePnl
        - premiumByMonth
        - rollChains
      properties:
        summary:
          type: object
          required:
            - closedCount
            - winCount
            - lossCount
            - winRate
            - totalRealizedPnl
            - totalPremiumCollected
            - avgPremiumPerTrade
            - avgDaysHeld
          properties:
            closedCount: { type: integer }
            winCount: { type: integer, description: "Closed trades with realized P/L >= 0" }
            lossCount: { type: integer }
            winRate: { type: number, description: "winCount / closedCount, 0 when no closed trades" }
            totalRealizedPnl: { type: number }
            totalPremiumCollected: { type: number, description: "Sum of premium*100*contracts across closed trades" }
            avgPremiumPerTrade: { type: number }
            avgDaysHeld: { type: number, description: "Calendar days between openedAt and closedAt" }
            bestTrade:
              type: ["object", "null"]
              required: [id, ticker, strike, expiry, contracts, realizedPnl, closedAt]
              properties:
                id: { type: integer }
                ticker: { type: string }
                strike: { type: number }
                expiry: { type: string }
                contracts: { type: integer }
                realizedPnl: { type: number }
                closedAt: { type: string }
            worstTrade:
              type: ["object", "null"]
              required: [id, ticker, strike, expiry, contracts, realizedPnl, closedAt]
              properties:
                id: { type: integer }
                ticker: { type: string }
                strike: { type: number }
                expiry: { type: string }
                contracts: { type: integer }
                realizedPnl: { type: number }
                closedAt: { type: string }
        cumulativePnl:
          type: array
          description: One point per closed trade (in close order); cumulative running total.
          items:
            type: object
            required: [date, pnl, cumulative]
            properties:
              date: { type: string, description: "ISO datetime of close" }
              pnl: { type: number, description: "Realized P/L for that trade" }
              cumulative: { type: number, description: "Running total of realized P/L" }
        premiumByMonth:
          type: array
          description: Premium collected (premium*100*contracts) grouped by close month.
          items:
            type: object
            required: [month, premium, count]
            properties:
              month: { type: string, description: "YYYY-MM" }
              premium: { type: number }
              count: { type: integer }
        rollChains:
          type: array
          description: Multi-leg roll chains (each chain has 2+ linked legs).
          items:
            $ref: "#/components/schemas/RollChain"

    RollSuggestionStrike:
      type: object
      required: [kind, strike, premium, bid, ask, mid, lastPrice]
      properties:
        kind:
          type: string
          enum: [same, down5]
          description: same = same strike as current; down5 = ~5% lower strike snapped to nearest available
        strike: { type: number, description: "Strike snapped to the nearest available strike on the suggested expiry's chain" }
        premium: { type: number, description: "Recommended premium per share — bid when > 0, else mid of bid/ask, else lastPrice; 0 when no quote" }
        bid: { type: number }
        ask: { type: number }
        mid: { type: number, description: "(bid+ask)/2 when both > 0, else 0" }
        lastPrice: { type: number }

    RollQuote:
      type: object
      required: [ticker, expiry, strike, bid, ask, mid, lastPrice, premium, spot, fetchedAt]
      properties:
        ticker: { type: string }
        expiry: { type: string }
        strike: { type: number, description: "Strike snapped to the nearest available strike on the requested expiry's chain" }
        requestedStrike: { type: number, description: "The strike originally requested before snapping" }
        bid: { type: number }
        ask: { type: number }
        mid: { type: number, description: "(bid+ask)/2 when both > 0, else 0" }
        lastPrice: { type: number }
        premium: { type: number, description: "Recommended premium per share — bid when > 0, else mid, else lastPrice; 0 when no quote" }
        spot: { type: number }
        fetchedAt: { type: string }

    RollSuggestion:
      type: object
      required: [ticker, currentExpiry, currentStrike, suggestedExpiry, dteFromNow, dteFromCurrent, spot, fetchedAt, options]
      properties:
        ticker: { type: string }
        currentExpiry: { type: string }
        currentStrike: { type: number }
        suggestedExpiry:
          type: string
          description: Next standard monthly expiry (third Friday) on or after currentExpiry+21d
        dteFromNow: { type: integer, description: "Days from today to suggestedExpiry" }
        dteFromCurrent: { type: integer, description: "Days from currentExpiry to suggestedExpiry" }
        spot: { type: number }
        fetchedAt: { type: string }
        options:
          type: array
          items:
            $ref: "#/components/schemas/RollSuggestionStrike"

    PositionAdvisorChainLeg:
      type: object
      required: [id, strike, expiry, premium, contracts, status, closePrice]
      properties:
        id: { type: integer }
        strike: { type: number }
        expiry: { type: string }
        premium: { type: number }
        contracts: { type: integer }
        closePrice: { type: ["number", "null"] }
        status:
          type: string
          enum: [open, closed]

    PositionAdvisorRollTarget:
      type: object
      required: [expiry, strike, premium, netCredit, newAnnualizedYield, dteFromNow]
      properties:
        expiry: { type: string, description: "YYYY-MM-DD" }
        strike: { type: number }
        premium: { type: number, description: "Per-share premium for the new leg" }
        netCredit:
          type: number
          description: "(newPremium - currentBuyToClose) * 100 * contracts; net dollars added by the roll"
        newAnnualizedYield:
          type: number
          description: "(premium / strike) * (365 / dte); decimal yield (0.18 = 18%)"
        dteFromNow: { type: integer }

    PositionAdvisorContext:
      type: object
      required:
        - position
        - costBasisPerShare
        - netPremiumPerShare
        - totalPremiumCollected
        - chainLegs
        - quote
        - rollTargets
        - concentration
        - assignmentCostPerShare
        - assignmentCostTotal
      properties:
        position:
          type: object
          required: [id, ticker, strike, expiry, premium, contracts, dte]
          properties:
            id: { type: integer }
            ticker: { type: string }
            strike: { type: number }
            expiry: { type: string }
            premium: { type: number }
            contracts: { type: integer }
            dte: { type: integer }
        costBasisPerShare:
          type: number
          description: "Effective per-share cost basis if assigned: strike - netPremiumPerShare. E.g. a 200-strike put with $2.50 net premium collected gives $197.50."
        netPremiumPerShare:
          type: number
          description: "Net premium per share (premium received - close cost) summed across every leg in the chain. The raw offset before subtracting from strike."
        totalPremiumCollected:
          type: number
          description: "Total premium dollars across every leg in the chain (after close costs)."
        chainLegs:
          type: array
          items:
            $ref: "#/components/schemas/PositionAdvisorChainLeg"
        quote:
          type: object
          required: [spot, currentBid, intrinsic, extrinsic, fetchedAt]
          properties:
            spot: { type: ["number", "null"] }
            currentBid: { type: ["number", "null"] }
            intrinsic:
              type: ["number", "null"]
              description: "max(strike - spot, 0); per share"
            extrinsic:
              type: ["number", "null"]
              description: "max(currentBid - intrinsic, 0); per share"
            fetchedAt: { type: ["string", "null"] }
        rollTargets:
          type: array
          description: Top 3 candidate roll targets (same / -5% / -10% strike on the next monthly expiry).
          items:
            $ref: "#/components/schemas/PositionAdvisorRollTarget"
        concentration:
          type: object
          required:
            - totalCar
            - tickerCar
            - tickerPct
            - sector
            - sectorCar
            - sectorPct
            - openPositionsInTicker
          properties:
            totalCar: { type: number }
            tickerCar: { type: number }
            tickerPct: { type: number, description: "tickerCar / totalCar (0..1)" }
            sector: { type: string }
            sectorCar: { type: number }
            sectorPct: { type: number, description: "sectorCar / totalCar (0..1)" }
            openPositionsInTicker: { type: integer }
        assignmentCostPerShare:
          type: number
          description: "Strike (per share) — what the trader pays if assigned"
        assignmentCostTotal:
          type: number
          description: "strike * 100 * contracts"

    PositionAdvisorVerdict:
      type: object
      required: [verdict, summary, bullets]
      properties:
        verdict:
          type: string
          enum: [roll, assign, close]
        summary:
          type: string
          description: 1-sentence headline rationale
        bullets:
          type: array
          minItems: 1
          items: { type: string }
          description: 2-4 short bullets citing concrete numbers from the context.
        recommendedRoll:
          type: object
          required: [expiry, strike]
          description: Present only when verdict is "roll".
          properties:
            expiry: { type: string }
            strike: { type: number }

    PositionAdvisor:
      type: object
      required: [available, context, verdict, generatedAt]
      properties:
        available:
          type: boolean
          description: True when an LLM verdict was produced; false on graceful fallback.
        context:
          $ref: "#/components/schemas/PositionAdvisorContext"
        verdict:
          oneOf:
            - $ref: "#/components/schemas/PositionAdvisorVerdict"
            - type: "null"
          description: The LLM recommendation, or null when AI is unavailable.
        unavailableReason:
          type: string
          description: Why the verdict is null (only present when available=false).
        generatedAt:
          type: string
          description: ISO timestamp when this response was assembled.

    DeleteResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    CallCandidate:
      type: object
      required:
        - ticker
        - spot
        - shares
        - avgCost
        - contractsAvailable
        - expiry
        - dte
        - strike
        - delta
        - bid
        - iv
        - openInterest
        - premiumPerContract
        - premiumTotal
        - staticReturnPct
        - annualizedPct
        - pctOtm
        - earningsInWindow
        - aboveBasis
        - ivRankBasis
        - ivPercentile
      properties:
        ticker: { type: string }
        spot: { type: number }
        shares: { type: integer }
        avgCost: { type: number }
        contractsAvailable: { type: integer, description: "floor(shares/100) — max contracts that can be sold covered" }
        expiry: { type: string, description: "ISO date YYYY-MM-DD" }
        dte: { type: integer }
        strike: { type: number }
        delta: { type: number }
        bid: { type: number }
        ask: { type: ["number", "null"] }
        iv: { type: number }
        openInterest: { type: integer }
        volume: { type: ["integer", "null"] }
        premiumPerContract: { type: number }
        premiumTotal: { type: number, description: "premium * 100 * contractsAvailable" }
        staticReturnPct: { type: number, description: "premium / spot — shares are the collateral, not cash" }
        annualizedPct: { type: number }
        pctOtm: { type: number }
        ivRank: { type: ["number", "null"] }
        ivPercentile: { type: ["number", "null"] }
        ivRankBasis:
          type: string
          enum: [real, provisional]
        hv30: { type: ["number", "null"] }
        earningsDate: { type: ["string", "null"] }
        earningsInWindow: { type: boolean }
        aboveBasis: { type: boolean, description: "True when strike > avgCost (assignment would still realize a gain on the shares)" }

    ExplainCandidateInput:
      type: object
      required: [ticker, strike, expiry]
      properties:
        ticker: { type: string, minLength: 1 }
        strike: { type: number, exclusiveMinimum: 0 }
        expiry: { type: string, description: "ISO date YYYY-MM-DD" }
        regenerate:
          type: boolean
          description: When true, bypass the cache and ask the model for a fresh explanation.

    CandidateExplanation:
      type: object
      required: [verdict, summary, bullets, source, model, generatedAt, ticker, strike, expiry]
      properties:
        ticker: { type: string }
        strike: { type: number }
        expiry: { type: string }
        verdict:
          type: string
          enum: [good_fit, mixed, avoid]
          description: Headline judgment used to color the badge.
        summary:
          type: string
          description: 2–4 sentence plain-English rationale suitable for inline display.
        bullets:
          type: array
          description: Short bullet points expanding on the summary (yield, IV, earnings, delta, concentration).
          items: { type: string }
        source:
          type: string
          enum: [llm, cache, fallback]
          description: Where the explanation came from. `cache` is a re-served LLM response; `fallback` is the deterministic non-AI summary.
        model:
          type: string
          description: Model identifier when `source` is `llm`/`cache`; "fallback" otherwise.
        generatedAt:
          type: string
          description: ISO timestamp when the explanation was originally produced.
        cached:
          type: boolean
          description: True when the response was served from the cache without re-calling the model.

    CallScanResult:
      type: object
      required: [scannedAt, candidates, errors, holdingsScanned, holdingsWithCandidate]
      properties:
        scannedAt: { type: string }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CallCandidate"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ScanError"
        holdingsScanned: { type: integer }
        holdingsWithCandidate: { type: integer }

    HoldingInput:
      type: object
      required: [ticker, shares, avgCost]
      properties:
        ticker: { type: string, minLength: 1 }
        shares: { type: integer, minimum: 1 }
        avgCost: { type: number, exclusiveMinimum: 0, description: "Average cost basis per share" }
        notes: { type: ["string", "null"] }

    HoldingUpdate:
      type: object
      properties:
        shares: { type: ["integer", "null"], minimum: 1 }
        avgCost: { type: ["number", "null"], exclusiveMinimum: 0 }
        notes: { type: ["string", "null"] }

    Holding:
      type: object
      required: [id, ticker, shares, avgCost, openedAt]
      properties:
        id: { type: integer }
        ticker: { type: string }
        shares: { type: integer }
        avgCost: { type: number }
        openedAt: { type: string }
        notes: { type: ["string", "null"] }
        spot: { type: ["number", "null"], description: "Current underlying price" }
        marketValue: { type: ["number", "null"], description: "spot * shares" }
        unrealizedPnl: { type: ["number", "null"], description: "(spot - avgCost) * shares" }
        unrealizedPnlPct: { type: ["number", "null"], description: "Unrealized P/L as a fraction of cost basis" }

    HoldingsList:
      type: object
      required: [holdings, totals]
      properties:
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/Holding"
        totals:
          type: object
          required: [holdingsCount, totalCost, totalMarketValue, totalUnrealizedPnl]
          properties:
            holdingsCount: { type: integer }
            totalCost: { type: number }
            totalMarketValue: { type: number }
            totalUnrealizedPnl: { type: number }

    Notification:
      type: object
      required: [id, positionId, kind, ticker, message, triggeredAt]
      properties:
        id: { type: integer }
        positionId: { type: integer }
        kind:
          type: string
          enum: [itm, expiring_soon]
          description: itm = spot has fallen below strike; expiring_soon = DTE <= 3
        ticker: { type: string }
        message: { type: string }
        triggeredAt: { type: string }
        acknowledgedAt: { type: ["string", "null"] }

    NotificationsList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unreadCount: { type: integer }

    AckAllResult:
      type: object
      required: [acknowledged]
      properties:
        acknowledged: { type: integer }

    AlertScanResult:
      type: object
      required: [scanned, itmAlerts, expiringAlerts]
      properties:
        scanned: { type: integer }
        itmAlerts: { type: integer }
        expiringAlerts: { type: integer }

    Tier:
      type: string
      enum: [free, pro, ultra]

    Capability:
      type: string
      description: Stable identifier for a gateable feature. See lib/tiers for the canonical list.
      enum:
        - ai.explainer
        - ai.advisor
        - ai.qa
        - alerts.email
        - screener.fullUniverse
        - data.realtime

    CapabilityEntry:
      type: object
      required: [capability, label, description, requiredTier, available]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        label: { type: string }
        description: { type: string }
        requiredTier: { $ref: "#/components/schemas/Tier" }
        available:
          type: boolean
          description: True when the current tier satisfies requiredTier.

    TierStatus:
      type: object
      required: [tier, capabilities]
      properties:
        tier: { $ref: "#/components/schemas/Tier" }
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityEntry"

    TierUpdate:
      type: object
      required: [tier]
      properties:
        tier: { $ref: "#/components/schemas/Tier" }

    TierBlocked:
      type: object
      required: [code, capability, required, current]
      properties:
        code:
          type: string
          enum: [tier_required]
        capability: { $ref: "#/components/schemas/Capability" }
        required: { $ref: "#/components/schemas/Tier" }
        current: { $ref: "#/components/schemas/Tier" }

    QaConversationInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }

    QaConversationUpdate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }

    QaConversationListItem:
      type: object
      required: [id, title, createdAt, lastMessageAt, lastMessagePreview, messageCount]
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string }
        lastMessageAt:
          type: ["string", "null"]
          description: ISO timestamp of the most recent message in the conversation, or null when empty.
        lastMessagePreview:
          type: ["string", "null"]
          description: Short truncated preview of the most recent message text.
        messageCount: { type: integer }

    QaConversationList:
      type: object
      required: [conversations, hasMore]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/QaConversationListItem"
        hasMore:
          type: boolean
          description: True when more rows exist past the requested limit+offset window.

    QaConversation:
      type: object
      required: [id, title, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string }

    QaAttachment:
      type: object
      description: |
        A structured renderable attached to an assistant message. Today we
        only emit `table` attachments, but the discriminator gives us room
        to add charts later without re-shaping persisted history.
      required: [type, title, columns, rows]
      properties:
        type:
          type: string
          enum: [table]
        title: { type: string }
        columns:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
              align:
                type: string
                enum: [left, right]
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        deepLinkColumn:
          type: ["string", "null"]
          description: |
            When set, the cell in this column is rendered as an in-app link.
            Each row may include a `${key}Href` field with the destination.

    QaMessage:
      type: object
      required: [id, conversationId, role, content, attachments, createdAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/QaAttachment"
        createdAt: { type: string }

    QaConversationWithMessages:
      type: object
      required: [id, title, createdAt, messages]
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/QaMessage"

    QaSendMessageInput:
      type: object
      required: [conversationId, content]
      properties:
        conversationId: { type: integer }
        content: { type: string, minLength: 1, maxLength: 4000 }

    QaSendMessageResult:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage: { $ref: "#/components/schemas/QaMessage" }
        assistantMessage: { $ref: "#/components/schemas/QaMessage" }

    QaUnavailable:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [unavailable, rate_limit, auth, timeout, unknown]

    SectorMap:
      type: object
      required: [sectors]
      properties:
        sectors:
          type: object
          description: Map from uppercased ticker to GICS-flavored sector label.
          additionalProperties:
            type: string

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1, format: uri }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    AuthErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
